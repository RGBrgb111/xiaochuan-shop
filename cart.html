<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>购物车 - 笑川の小店</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 购物车专属样式（可后续移入 style.css） */
    .cart-empty {
      text-align: center;
      padding: 60px 20px;
      color: #777;
    }
    .cart-table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }
    .cart-table th,
    .cart-table td {
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }
    .cart-item-image {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
    }
    .quantity-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .quantity-btn {
      width: 28px;
      height: 28px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
    }
    .quantity-input {
      width: 50px;
      padding: 4px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .remove-btn {
      color: #e74c3c;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }
    .cart-summary {
      background: #f9f5f0;
      padding: 20px;
      border-radius: 8px;
      max-width: 300px;
      margin-left: auto;
    }
    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="container nav-content">
      <a href="index.html" class="nav-logo">笑川の小店</a>
      <button class="menu-toggle">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="cart.html">购物车</a></li>
      </ul>
      <a href="cart.html" class="cart-icon">
        🛒
        <span class="cart-count" id="cartCount">0</span>
      </a>
    </div>
  </nav>

  <div class="container">
    <h1 style="margin: 30px 0; text-align: center;">我的购物车</h1>

    <div id="cartContent">
      <!-- 购物车内容由 JS 动态生成 -->
    </div>
  </div>

  <script>
    // 更新右上角购物车数量
    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      const count = cart.reduce((sum, item) => sum + item.quantity, 0);
      document.getElementById('cartCount').textContent = count;
    }

    // 保存购物车到 localStorage
    function saveCart(cart) {
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartCount();
      renderCart(); // 重新渲染
    }

    // 渲染购物车
    function renderCart() {
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      const cartContent = document.getElementById('cartContent');

      if (cart.length === 0) {
        cartContent.innerHTML = `<div class="cart-empty">🛒 购物车空空如也<br><a href="index.html" style="color:#2c2620; text-decoration:underline; margin-top:10px; display:inline-block;">去逛逛</a></div>`;
        return;
      }

      let total = 0;
      let html = `
        <table class="cart-table">
          <thead>
            <tr>
              <th>商品</th>
              <th>规格</th>
              <th>单价</th>
              <th>数量</th>
              <th>小计</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
      `;

      cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;

        html += `
          <tr>
            <td>
              <img src="${item.image}" alt="" class="cart-item-image">
              ${item.name}
            </td>
            <td>${item.variant}</td>
            <td>¥${item.price.toFixed(2)}</td>
            <td>
              <div class="quantity-control">
                <button class="quantity-btn" onclick="changeQuantity(${index}, -1)">-</button>
                <input type="text" class="quantity-input" value="${item.quantity}" 
                       onblur="updateQuantity(${index}, this.value)">
                <button class="quantity-btn" onclick="changeQuantity(${index}, 1)">+</button>
              </div>
            </td>
            <td>¥${itemTotal.toFixed(2)}</td>
            <td>
              <button class="remove-btn" onclick="removeItem(${index})">×</button>
            </td>
          </tr>
        `;
      });

      html += `</tbody></table>
<div class="cart-summary">
  <div>共 <strong>${cart.reduce((sum, item) => sum + item.quantity, 0)}</strong> 件商品</div>
  <div class="total-row"><span>总计：</span><span>¥${total.toFixed(2)}</span></div>
</div>
<div style="text-align: center; margin-top: 20px;">
  <button 
    onclick="window.location.href='checkout.html'" 
    style="padding: 12px 40px; background: #2c2620; color: white; border: none; border-radius: 6px; font-size: 18px; cursor: pointer; font-weight: bold;"
    onmouseover="this.style.opacity='0.9'"
    onmouseout="this.style.opacity='1'"
  >
    去结算
  </button>
</div>
      `;

      cartContent.innerHTML = html;
    }

    // 修改数量（+/- 按钮）
    function changeQuantity(index, delta) {
      let cart = JSON.parse(localStorage.getItem('cart') || '[]');
      cart[index].quantity += delta;
      if (cart[index].quantity < 1) cart[index].quantity = 1;
      saveCart(cart);
    }

    // 手动输入数量
    function updateQuantity(index, value) {
      const num = parseInt(value);
      if (isNaN(num) || num < 1) {
        alert('数量必须为大于0的整数');
        renderCart(); // 重置输入框
        return;
      }
      let cart = JSON.parse(localStorage.getItem('cart') || '[]');
      cart[index].quantity = num;
      saveCart(cart);
    }

    // 删除商品
    function removeItem(index) {
      if (!confirm('确定要删除此商品吗？')) return;
      let cart = JSON.parse(localStorage.getItem('cart') || '[]');
      cart.splice(index, 1);
      saveCart(cart);
    }

    // 初始化
    updateCartCount();
    renderCart();
  </script>
